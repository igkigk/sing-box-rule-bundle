name: Publish sing-box rule bundle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and validate immutable bundle
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.RULE_BUNDLE_SIGNING_KEY }}
        run: |
          set -euo pipefail

          test -n "$SIGNING_KEY"
          work="$RUNNER_TEMP/rule-bundle"
          rm -rf "$work"
          mkdir -p "$work/files"

          source_commit="$(curl -fsSL --retry 4 --connect-timeout 15 --max-time 60 \
            https://api.github.com/repos/MetaCubeX/meta-rules-dat/commits/sing | jq -r '.sha')"
          test "${#source_commit}" -eq 40

          version="$(date -u +%Y%m%dT%H%M%SZ)-${source_commit:0:12}"
          upstream="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/${source_commit}/geo"
          export VERSION="$version"

          declare -A urls=(
            [geosite-openai.srs]="$upstream/geosite/openai.srs"
            [geosite-google-gemini.srs]="$upstream/geosite/google-gemini.srs"
            [geosite-ai.srs]="$upstream/geosite/category-ai-!cn.srs"
            [geoip-ai.srs]="$upstream/geoip/ai.srs"
            [geosite-cn.srs]="$upstream/geosite/cn.srs"
            [geosite-not-cn.srs]="$upstream/geosite/geolocation-!cn.srs"
            [geoip-cn.srs]="$upstream/geoip/cn.srs"
          )

          for file in geosite-openai.srs geosite-google-gemini.srs geosite-ai.srs geoip-ai.srs geosite-cn.srs geosite-not-cn.srs geoip-cn.srs; do
            curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 120 \
              "${urls[$file]}" -o "$work/files/$file"
            size="$(stat -c '%s' "$work/files/$file")"
            test "$size" -ge 128
            docker run --rm -v "$work:/work" ghcr.io/sagernet/sing-box:v1.13.14 \
              rule-set decompile "/work/files/$file" -o "/tmp/$file.json" >/dev/null
          done

          files_json="$(for file in geosite-openai.srs geosite-google-gemini.srs geosite-ai.srs geoip-ai.srs geosite-cn.srs geosite-not-cn.srs geoip-cn.srs; do
            size="$(stat -c '%s' "$work/files/$file")"
            hash="$(sha256sum "$work/files/$file" | awk '{print $1}')"
            jq -n --arg name "$file" --arg sha256 "$hash" --argjson size "$size" \
              '{name: $name, sha256: $sha256, size: $size, path: ("releases/" + env.VERSION + "/files/" + $name)}'
          done | jq -s .)"

          jq -n \
            --arg bundle_version "$version" \
            --arg source_repository "MetaCubeX/meta-rules-dat" \
            --arg source_ref "sing" \
            --arg source_commit "$source_commit" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson files "$files_json" \
            '{schema: 1, bundle_version: $bundle_version, source: {repository: $source_repository, ref: $source_ref, commit: $source_commit}, generated_at: $generated_at, files: $files}' \
            > "$work/manifest.json"

          printf '%s' "$SIGNING_KEY" > "$work/private.pem"
          openssl pkeyutl -sign -rawin -inkey "$work/private.pem" \
            -in "$work/manifest.json" -out "$work/manifest.sig"
          rm -f "$work/private.pem"

          release="releases/$version"
          rm -rf "$release"
          mkdir -p "$release/files"
          cp "$work/manifest.json" "$release/manifest.json"
          cp "$work/manifest.sig" "$release/manifest.sig"
          cp "$work/files"/*.srs "$release/files/"
          cp "$work/manifest.json" current.json
          cp "$work/manifest.sig" current.sig

          git config user.name "sing-box rule publisher"
          git config user.email "actions@users.noreply.github.com"
          git add current.json current.sig "$release"
          git commit -m "Publish rule bundle $version"
          git push
